spring.application.name=webdev2
server.port=8080
server.forward-headers-strategy=none

spring.datasource.url=jdbc:mysql://localhost:3307/vetclinic_f5_release
spring.datasource.username=vetclinic_app
spring.datasource.password=replace_with_local_app_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Comma-separated list of explicit allowed origins (default same-origin)
app.cors.allowed-origins=http://localhost:8080

# Set COOKIE_SECURE=true when serving behind HTTPS
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Set only on initial local provisioning to seed BCrypt test users
app.seed.reader-username=clinic_viewer
app.seed.reader-password=replace_with_local_reader_password
app.seed.manager-username=clinic_manager
app.seed.manager-password=replace_with_local_manager_password
